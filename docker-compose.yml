networks:
    back:
        driver: bridge

volumes:
    db-data:
        driver: local
        driver_opts:
            device: '${HOME}/coscrad-arangodb-docker-shared-volume'
services:
    database:
        image: arangodb
        expose:
            - '8529'
        ports:
            - '8529:8529'

        environment:
            - ARANGO_ROOT_PASSWORD=super-confidential
            - DB_LINK_PORT_8529_TCP=tcp://172.80.0.2:8529
            - DB_LINK_PORT_8529_TCP_ADDR=172.80.0.2
            - DB_LINK_PORT_8529_TCP_PORT=8529
            - DB_LINK_PORT_8529_TCP_PROTO=tcp

            # ARANGO_DB_USER=${ARANGO_DB_USER}
            # ARANGO_DB_USER_PASSWORD=${ARANGO_DB_USER_PASSWORD}
            # ARANGO_DB_NAME=${ARANGO_DB_NAME}
            # ARANGO_DB_RUN_WITH_TEST_DATA=${ARANGO_DB_RUN_WITH_TEST_DATA}
            # ARANGODB_DESTINATION_CONTAINER_DOCKER_SHARED_VOLUME_SCRIPTS_PATH=${ARANGODB_DESTINATION_CONTAINER_DOCKER_SHARED_VOLUME_SCRIPTS_PATH}
            # COSCRAD_ENVIRONMENT=${COSCRAD_ENVIRONMENT}

        networks:
            - back

    server:
        env_file:
            - path: ./apps/api/src/app/config/development.env
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        ports:
            - '3131:3131'

        restart: on-failure

        networks:
            - back

        depends_on:
            - database
